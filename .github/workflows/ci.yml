name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Warnings are regressions; the baseline is zero (CLAUDE.md).
      - name: Build
        run: dotnet build Rambutan.slnx -warnaserror

      - name: Test
        run: dotnet test Rambutan.slnx --no-build

      # NativeAOT is a day-one commitment: publishing must never rot.
      - name: NativeAOT publish smoke
        run: dotnet publish src/Rambutan.App -c Release -r ${{ matrix.rid }}
